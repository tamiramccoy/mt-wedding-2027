*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#172D1A;color:#EDEAE7;font-family:Montserrat,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 22px;text-align:center}
main{width:100%;max-width:360px}
.logo{width:64px;height:64px;display:block;margin:0 auto}
hr{width:56px;border:0;border-top:1px solid rgba(237,234,231,.45);margin:30px auto}
.soon{font-size:13px;letter-spacing:.22em;text-transform:uppercase;margin:0}
.tr{margin:8px 0 0;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:15px;opacity:.8}
form{margin-top:38px}
.pw{position:relative}
.pw input{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(237,234,231,.6);color:#EDEAE7;font:16px Montserrat,Arial,sans-serif;letter-spacing:.06em;text-align:center;padding:12px 36px;outline:0;border-radius:0}
.pw input::placeholder{color:rgba(237,234,231,.55);letter-spacing:.12em}
.pw input:focus{border-bottom-color:#EDEAE7}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:20px;height:20px;padding:0;cursor:pointer;opacity:.65;filter:invert(1)}
.err{margin:12px 0 0;font-size:13px;color:#F2C4B8}
.remember{display:inline-flex;align-items:center;gap:10px;margin-top:20px;font-size:12px;letter-spacing:.06em;opacity:.85;cursor:pointer}
.remember input{width:16px;height:16px;accent-color:#EDEAE7;margin:0}
.btn{display:block;width:100%;margin-top:24px;background:transparent;color:#EDEAE7;border:1px solid rgba(237,234,231,.7);border-radius:3px;padding:13px;font:500 13px Montserrat,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;-webkit-appearance:none}
.btn:hover,.btn:focus{background:#EDEAE7;color:#172D1A;outline:0}
.spin{height:100%;display:flex;align-items:center;justify-content:center}
.spin div{width:28px;height:28px;border:2px solid rgba(237,234,231,.6);border-right-color:transparent;border-radius:50%;animation:r .75s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
